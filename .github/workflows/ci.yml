# Adapted from Argosy Launcher's .github/workflows/build.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Meiki's OCR models (45 MB) are fetched by Gradle; keep them between runs.
      - name: Cache Meiki models
        uses: actions/cache@v4
        with:
          path: .gradle/meiki
          key: meiki-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: meiki-

      # The built-in player's libretro cores (~5 MB) are fetched by Gradle too.
      - name: Cache libretro cores
        uses: actions/cache@v4
        with:
          path: .gradle/cores
          key: cores-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: cores-

      # bsnes-mercury, the Super Famicom core, is built from its submodule (third_party/bsnes-mercury):
      # once per pinned commit, kept here so later runs only copy it.
      - name: Note the bsnes-mercury commit
        run: echo "BSNES_COMMIT=$(git rev-parse HEAD:third_party/bsnes-mercury)" >> "$GITHUB_ENV"

      - name: Cache the built bsnes-mercury
        uses: actions/cache@v4
        with:
          path: .gradle/cores/libbsnes_mercury_libretro_android-${{ env.BSNES_COMMIT }}
          key: bsnes-mercury-${{ env.BSNES_COMMIT }}

      # Beetle Saturn, the Saturn core, likewise.
      - name: Note the Beetle Saturn commit
        run: echo "BEETLE_SATURN_COMMIT=$(git rev-parse HEAD:third_party/beetle-saturn)" >> "$GITHUB_ENV"

      - name: Cache the built Beetle Saturn
        uses: actions/cache@v4
        with:
          path: .gradle/cores/libmednafen_saturn_libretro_android-${{ env.BEETLE_SATURN_COMMIT }}
          key: beetle-saturn-${{ env.BEETLE_SATURN_COMMIT }}

      # Dolphin, the GameCube core, likewise (third_party/dolphin, which checkout skips): its
      # source is fetched and built only when this cache has no build of the pinned commit.
      - name: Note the Dolphin commit
        run: echo "DOLPHIN_COMMIT=$(git rev-parse HEAD:third_party/dolphin)" >> "$GITHUB_ENV"

      - name: Cache the built Dolphin
        uses: actions/cache@v4
        with:
          path: .gradle/cores/libdolphin_libretro_android-${{ env.DOLPHIN_COMMIT }}
          # A changed build script may change the Sys zip, which is remade from the source alone;
          # the core of the same commit comes back from the cache before it.
          key: dolphin-${{ env.DOLPHIN_COMMIT }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: dolphin-${{ env.DOLPHIN_COMMIT }}

      # Flycast, the Dreamcast core, likewise (third_party/flycast, which checkout skips).
      - name: Note the Flycast commit
        run: echo "FLYCAST_COMMIT=$(git rev-parse HEAD:third_party/flycast)" >> "$GITHUB_ENV"

      - name: Cache the built Flycast
        uses: actions/cache@v4
        with:
          path: .gradle/cores/libflycast_libretro_android-${{ env.FLYCAST_COMMIT }}
          key: flycast-${{ env.FLYCAST_COMMIT }}

      # LRPS2, the PS2 core (debug builds only), likewise (third_party/lrps2, which checkout skips).
      - name: Note the LRPS2 commit
        run: echo "LRPS2_COMMIT=$(git rev-parse HEAD:third_party/lrps2)" >> "$GITHUB_ENV"

      # The build's folder is named for its patches and build tag too (BuildCmakeCore), so the
      # folders of the commit are cached, under a key that changes with either.
      - name: Cache the built LRPS2
        uses: actions/cache@v4
        with:
          path: .gradle/cores/libpcsx2_libretro_android-${{ env.LRPS2_COMMIT }}-*
          key: lrps2-${{ env.LRPS2_COMMIT }}-${{ hashFiles('patches/lrps2/*.patch', 'app/build.gradle.kts') }}
          restore-keys: lrps2-${{ env.LRPS2_COMMIT }}

      # The PC hook kit Genkan installs for GameNative games (tools/hookbridge): MinGW builds
      # the proxy and host; LunaHook comes from LunaTranslator's pinned release.
      - name: Cache LunaHook
        uses: actions/cache@v4
        with:
          path: tools/hookbridge/dl
          key: lunahook-${{ hashFiles('tools/hookbridge/get_lunahook.sh') }}

      - name: Build the hook kit
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-i686 gcc-mingw-w64-x86-64
          tools/hookbridge/kit.sh

      # One run of the unit tests: verifyRoborazziDebug runs every one of them, with the screenshot
      # tests comparing against the committed PNGs (a shot passes while under 1% of its pixels
      # differ). A changed screen comes with its re-recorded PNG (./gradlew :app:recordRoborazziDebug).
      - name: Build, test and lint
        run: ./gradlew assembleDebug lintDebug :app:verifyRoborazziDebug

      # Every unit test's report on a failure: what a test reported (an uncaught exception's
      # cause included) is only in its XML.
      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload screenshot comparisons
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-compare
          path: |
            app/build/outputs/roborazzi/*_compare.png
            app/build/test-results/testDebugUnitTest/TEST-app.genkan.ui.ScreenshotTest.xml
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
