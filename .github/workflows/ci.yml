# Adapted from Argosy Launcher's .github/workflows/build.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Meiki's OCR models (45 MB) are fetched by Gradle; keep them between runs.
      - name: Cache Meiki models
        uses: actions/cache@v4
        with:
          path: .gradle/meiki
          key: meiki-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: meiki-

      # The built-in player's libretro cores (~5 MB) are fetched by Gradle too.
      - name: Cache libretro cores
        uses: actions/cache@v4
        with:
          path: .gradle/cores
          key: cores-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: cores-

      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
