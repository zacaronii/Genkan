# Adapted from Argosy Launcher's .github/workflows/build.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Meiki's OCR models (45 MB) are fetched by Gradle; keep them between runs.
      - name: Cache Meiki models
        uses: actions/cache@v4
        with:
          path: .gradle/meiki
          key: meiki-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: meiki-

      # The built-in player's libretro cores (~5 MB) are fetched by Gradle too.
      - name: Cache libretro cores
        uses: actions/cache@v4
        with:
          path: .gradle/cores
          key: cores-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: cores-

      # The PC hook kit Genkan installs for GameNative games (tools/hookbridge): MinGW builds
      # the proxy and host; LunaHook comes from LunaTranslator's pinned release.
      - name: Cache LunaHook
        uses: actions/cache@v4
        with:
          path: tools/hookbridge/dl
          key: lunahook-${{ hashFiles('tools/hookbridge/get_lunahook.sh') }}

      - name: Build the hook kit
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-i686 gcc-mingw-w64-x86-64
          tools/hookbridge/kit.sh

      # recordRoborazziDebug runs the unit tests with the screenshot tests recording, so a
      # changed screen never fails the build; the PNGs are uploaded below for review.
      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest :app:recordRoborazziDebug lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/src/test/screenshots/*.png
          if-no-files-found: warn
